name: Serenity Daily Analysis

on:
  schedule:
    # Daily at 19:00/20:00/21:00 Beijing time (11:00/12:00/13:00 UTC)
    - cron: '0 11,12,13 * * *'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Debug environment
        run: |
          python --version
          pip list | grep -i request
          echo "PUSHPLUS_TOKEN set: $([ -n \"$PUSHPLUS_TOKEN\" ] && echo YES || echo NO)"
          echo "DEEPSEEK_API_KEY set: $([ -n \"$DEEPSEEK_API_KEY\" ] && echo YES || echo NO)"
          ls -la data/
          ls -la serenity_report.html 2>/dev/null || echo "serenity_report.html NOT FOUND"
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Run Serenity Daily Analysis
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python serenity_cloud/main.py

      - name: Commit updated report and state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add serenity_report.html data/serenity_state.json
          git diff --cached --quiet || git commit -m "chore: update serenity daily report [skip ci]"
          git push
