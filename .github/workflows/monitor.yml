name: Twitter Monitor

on:
  schedule:
    - cron: "0 * * * *"   # 每小时整点执行
  workflow_dispatch:        # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cookies file
        env:
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: |
          mkdir -p data
          if [ -n "$TWITTER_COOKIES" ]; then
            echo "$TWITTER_COOKIES" > data/cookies.json
            echo "已从 Secret 恢复 Cookie"
          else
            echo "未找到 TWITTER_COOKIES，将使用账号密码登录"
          fi

      - name: Run monitor
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_TARGET_USER: "aleabitoreddit"
          COOKIE_FILE: "data/cookies.json"
        run: python src/main.py

      - name: Save last tweet ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_id.json data/cookies.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git push
