name: Twitter Monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # 每15分钟执行（防GitHub调度中断）
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write  # 允许自动提交 last_id.json

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          PUSHPLUS_TOKEN: "3d9d364039ab432ead44d9725e456f7a"
          TWITTER_TARGET_USER: "aleabitoreddit"
        run: python src/main.py

      - name: Save last tweet ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_id.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git push
